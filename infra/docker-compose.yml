
services:
  postgres:
    image: postgres:17
    container_name: pera-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: pera_db
      POSTGRES_USER: pera_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - pera_data:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d:ro

volumes:
  pera_data:
